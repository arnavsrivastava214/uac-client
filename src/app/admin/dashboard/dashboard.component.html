    <main class="flex-1 overflow-y-auto p-4 md:p-8 lg:p-10">
      <div class="container mx-auto">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
          <div *ngFor="let stat of stats"
               class="bg-gray-800 p-6 rounded-xl shadow-xl border border-gray-700
                      flex flex-col items-center text-center
                      transform transition-transform duration-300 hover:scale-[1.03] hover:shadow-2xl">
            <div [ngClass]="stat.bgColor" class="p-4 rounded-full mb-4">
              <svg class="h-12 w-12" [ngClass]="stat.color" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="getIconPath(stat.icon)"></path>
              </svg>
            </div>
            <h3 class="text-xl font-semibold text-gray-300">{{ stat.title }}</h3>
            <p class="text-5xl font-extrabold mt-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-300 to-purple-300">{{ stat.value }}</p>
          </div>
        </div>
  
        <div class="bg-gray-800 p-6 rounded-xl shadow-xl border border-gray-700 mb-10">
          <h2 class="text-3xl font-bold text-gray-100 mb-6 text-center animate-fade-in">Quick Actions</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <a *ngFor="let link of quickLinks" [routerLink]="link?.route"
               class="flex flex-col items-center justify-center p-6 rounded-lg bg-gray-700 hover:bg-gray-600
                      text-white text-center transition-all duration-300 ease-in-out transform hover:scale-105 shadow-md">
              <svg class="h-10 w-10 text-blue-300 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="getIconPath(link.icon)"></path>
              </svg>
              <span class="text-lg font-semibold">{{ link.name }}</span>
            </a>
          </div>
        </div>
  
        <div class="bg-gray-800 p-6 rounded-xl shadow-xl border border-gray-700">
          <h2 class="text-3xl font-bold text-gray-100 mb-6 text-center animate-fade-in">Recent Activity Feed (Placeholder)</h2>
          <div class="text-gray-400 text-center py-8">
            <p class="text-lg">No new activities to show right now.</p>
            <p class="mt-2 text-sm">This section could display student enrollments, course updates, or inquiries.</p>
          </div>
        </div>
      </div>
    </main>
  </div>
