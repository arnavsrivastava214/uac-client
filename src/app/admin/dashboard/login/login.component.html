<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 p-4">
    <div class="bg-white bg-opacity-10 backdrop-filter backdrop-blur-lg rounded-xl shadow-2xl p-8 sm:p-10 md:p-12 w-full max-w-md text-white border border-white border-opacity-20 animate-fade-in-up">
  
      <div class="text-center mb-8">
        <h2 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-pink-400 drop-shadow-md tracking-tight animate-fade-in">Welcome Sonu Sir!</h2>
        <p class="mt-2 text-gray-600 text-lg">Log in to your account</p>
      </div>
  
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-600 mb-1">Email Address</label>
          <input type="email" id="email" formControlName="email"
                 class="mt-1 block w-full px-4 py-2 bg-gray-100 bg-opacity-20 border border-white border-opacity-30 rounded-lg text-gray-600 placeholder-gray-600
                        focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition duration-200 ease-in-out
                        shadow-inner"
                 placeholder="your.email@example.com"
                 required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}">
          <div *ngIf="isFieldInvalid('email')">
            <p *ngIf="loginForm.get('email')?.errors?.['required']" class="text-red-300 text-xs mt-1">Email is required.</p>
            <p *ngIf="loginForm.get('email')?.errors?.['email']" class="text-red-300 text-xs mt-1">Please enter a valid email address.</p>
          </div>
        </div>
  
        <div>
          <label for="password" class="block text-sm font-medium text-gray-600 mb-1">Password</label>
          <input type="password" id="password" formControlName="password"
                 class="mt-1 block w-full px-4 py-2 bg-gray-100 bg-opacity-20 border border-white border-opacity-30 rounded-lg text-white placeholder-gray-600
                        focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition duration-200 ease-in-out
                        shadow-inner"
                 placeholder="Minimum 6 characters"
                 required minlength="6">
          <div *ngIf="isFieldInvalid('password')">
            <p *ngIf="loginForm.get('password')?.errors?.['required']" class="text-red-300 text-xs mt-1">Password is required.</p>
            <p *ngIf="loginForm.get('password')?.errors?.['minlength']" class="text-red-300 text-xs mt-1">Password must be at least 6 characters long.</p>
          </div>
        </div>
  
        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <input id="rememberMe" type="checkbox" formControlName="rememberMe"
                   class="h-4 w-4 text-blue-400 bg-gray-700 border-gray-600 rounded focus:ring-blue-500 transition duration-150 ease-in-out cursor-pointer">
            <label for="rememberMe" class="ml-2 block text-sm text-gray-600">Remember me</label>
          </div>
          <!-- <a href="#" class="text-sm font-medium text-blue-300 hover:text-blue-200 hover:underline transition-colors duration-200 ease-in-out">Forgot Password?</a> -->
        </div>
  
        <div *ngIf="errorMessage" class="bg-red-500 bg-opacity-30 border border-red-400 text-red-100 px-4 py-3 rounded-lg shadow-md animate-fade-in-down">
          {{ errorMessage }}
        </div>
  
        <div>
          <button type="submit"
                  [disabled]="loginForm.invalid || isLoading || !loginForm.value.rememberMe"
                  class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-lg text-lg font-semibold text-white
                         bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700
                         focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-75
                         transition-all duration-300 ease-in-out transform hover:scale-105
                         disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100 disabled:from-gray-600 disabled:to-gray-600">
            <span *ngIf="!isLoading">Log In</span>
            <div *ngIf="isLoading" class="flex items-center">
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Logging In...
            </div>
          </button>
        </div>
      </form>
  
  
    </div>
  </div>
