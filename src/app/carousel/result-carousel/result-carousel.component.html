<app-header></app-header>

<section class="py-12 bg-gray-50" style="padding-top: 90px;">
    <div class="container mx-auto px-4">
      <h2 class="text-4xl font-extrabold text-gray-900 text-center mb-10">Our Success Stories with Sonu Sir</h2>
  
      <div class="relative w-full max-w-4xl mx-auto overflow-hidden rounded-lg shadow-xl h-96">
        <div class="flex h-full transition-transform duration-500 ease-in-out"
             [style.transform]="'translateX(-' + currentIndex * 100 + '%)'">
          <ng-container *ngFor="let image of images; let i = index">
            <div class="w-full flex-shrink-0 relative h-full bg-gray-200 flex items-center justify-center" (click)="openPreview(i)">
              <img [src]="image.src" [alt]="image.alt"
                   class="max-w-full max-h-full object-contain cursor-pointer transform transition-transform duration-300 hover:scale-105"
                   [ngClass]="{'animate-carousel-slide-next': i === currentIndex && !isPrev, 'animate-carousel-slide-prev': i === currentIndex && isPrev}">
              <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black to-transparent p-4 text-white text-lg font-semibold rounded-b-lg opacity-80">
                {{ image.alt }}
              </div>
            </div>
          </ng-container>
        </div>
  
        <button (click)="prevImage()"
                 class="absolute top-1/2 left-4 -translate-y-1/2 bg-white bg-opacity-70 text-gray-800 p-3 rounded-full shadow-lg hover:bg-opacity-90 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-blue-500 z-10">
          <i class="fas fa-chevron-left text-xl"></i>
        </button>
        <button (click)="nextImage()"
                 class="absolute top-1/2 right-4 -translate-y-1/2 bg-white bg-opacity-70 text-gray-800 p-3 rounded-full shadow-lg hover:bg-opacity-90 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-blue-500 z-10">
          <i class="fas fa-chevron-right text-xl"></i>
        </button>
  
        <div class="absolute bottom-4 left-0 right-0 flex justify-center space-x-2 z-10">
          <span *ngFor="let image of images; let i = index"
                class="w-3 h-3 rounded-full bg-white cursor-pointer transition-colors duration-300"
                [ngClass]="{'bg-opacity-90': i === currentIndex, 'bg-opacity-50 hover:bg-opacity-70': i !== currentIndex}"
                (click)="goToImage(i)">
          </span>
        </div>
      </div>
    </div>
</section>
  
<div *ngIf="showPreview"
     class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 p-4 animate-fade-in-scale">
  <div class="relative max-w-5xl max-h-full mx-auto p-4 bg-gray-900 rounded-lg shadow-2xl flex flex-col items-center justify-center">
  
    <button (click)="closePreview()"
             class="absolute top-4 right-4 bg-red-600 text-white p-2 rounded-full text-lg hover:bg-red-700 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-red-500 z-20">
      <i class="fas fa-times"></i>
    </button>
  
    <img [src]="previewImageUrl" [alt]="images[previewImageIndex]?.alt"
         class="max-w-full max-h-[80vh] object-contain rounded-lg shadow-lg">
    
    <p class="text-white text-center mt-4 text-xl font-semibold">{{ images[previewImageIndex]?.alt }}</p>
  
    <button (click)="prevPreviewImage()"
             class="absolute top-1/2 left-4 -translate-y-1/2 bg-white bg-opacity-20 text-white p-3 rounded-full text-xl hover:bg-opacity-40 transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-white z-10">
      <i class="fas fa-chevron-left"></i>
    </button>
    <button (click)="nextPreviewImage()"
             class="absolute top-1/2 right-4 -translate-y-1/2 bg-white bg-opacity-20 text-white p-3 rounded-full text-xl hover:bg-opacity-40 transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-white z-10">
      <i class="fas fa-chevron-right"></i>
    </button>
  </div>
</div>
