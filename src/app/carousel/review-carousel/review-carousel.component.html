<section class="py-20 gradient-bg">
    <div class="container mx-auto px-6">
        <div class="text-center mb-16">
            <h2 class="text-4xl lg:text-5xl font-bold text-white mb-6">What Our Clients Say</h2>
            <p class="text-xl text-gray-200 max-w-3xl mx-auto">
                Real stories from real people who have transformed their lives through our coaching programs.
            </p>
        </div>

            <div *ngIf="testimonials.length > 0"
                 class="bg-white rounded-2xl p-8 shadow-xl testimonial-card"
                 [@slideAnimation]="currentTestimonialIndex">

                        <h4 class="font-bold text-gray-800 text-lg">{{testimonials[currentTestimonialIndex].name}}</h4>
                        <p class="text-gray-600 text-sm">{{testimonials[currentTestimonialIndex].position}}</p>
                    </div>
                </div>
                <p class="text-gray-700 leading-relaxed mb-4 text-base">
                    {{testimonials[currentTestimonialIndex].content}}
                </p>
                <div class="flex text-yellow-500">
                    <i *ngFor="let star of getStarArray(testimonials[currentTestimonialIndex].rating)" class="fas fa-star text-lg"></i>
                </div>
            </div>

            <div class="absolute bottom-[-50px] flex space-x-3">
                <span *ngFor="let testimonial of testimonials; let i = index"
                      [class.bg-white]="i === currentTestimonialIndex"
                      [class.bg-gray-400]="i !== currentTestimonialIndex"
                      class="block w-3 h-3 rounded-full cursor-pointer transition-colors duration-300 ease-in-out"
                      (click)="goToTestimonial(i)"
                      [attr.aria-label]="'Go to testimonial ' + (i + 1)"></span>
            </div>
        </div>
    </div>
