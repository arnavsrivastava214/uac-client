<app-header *ngIf="selectedImageIndex === null"></app-header>

<div class="gallery-page bg-[#0a0a0a]" [style.padding-top]="selectedImageIndex === null ? '150px' : '0'">
  <header class="text-center mb-10 pt-6" *ngIf="selectedImageIndex === null">
    <h1 class="text-4xl font-light text-white tracking-wide">UAC Gallery</h1>
    <div class="w-16 h-0.5 bg-blue-500 mx-auto mt-3"></div>
  </header>

  <div *ngIf="!loading" class="zoomable-grid" [style.--thumb-size.px]="thumbSize">
    <div *ngFor="let image of allImages; let i = index; trackBy: trackById"
         (click)="openPreview(i)" class="gallery-item cursor-pointer">
      <img [src]="image.thumb" loading="lazy" class="gallery-thumb" />
    </div>
  </div>
</div>

<div *ngIf="selectedImageIndex !== null" 
     class="slider-container"
     [style.background-color]="'rgba(0,0,0,' + bgOpacity + ')'"
     [style.backdrop-filter]="'blur(' + (bgOpacity * 15) + 'px)'"
     (touchstart)="onSwipeStart($event)" (touchmove)="onSwipeMove($event)" (touchend)="onSwipeEnd()"
     (mousedown)="onSwipeStart($event)" (mousemove)="onSwipeMove($event)" (mouseup)="onSwipeEnd()">

    <div class="filmstrip"
         [class.smooth-snap]="!isDragging"
         [style.transform]="'translate3d(' + ((-selectedImageIndex * 100) + (translateX / windowWidth * 100)) + '%, ' + translateY + 'px, 0)'">
      
      <div *ngFor="let img of allImages; let i = index" class="slide">
        <img [src]="img.src" 
             class="preview-img"
             [style.opacity]="selectedImageIndex === i ? 1 : 0.3"
             [style.transform]="'scale(' + (selectedImageIndex === i ? (1 - Math.abs(translateY)/2500) : 0.85) + ')'" />
      </div>
    </div>

    <button (click)="closePreview()" class="close-btn hidden md:flex">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="2"/></svg>
    </button>
</div>

<app-footer *ngIf="selectedImageIndex === null"></app-footer>
