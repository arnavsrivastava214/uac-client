<app-header></app-header>
<div class="min-h-screen bg-gray-100 font-sans p-4 sm:p-6 lg:p-8" style="padding-top: 150px;">

    <div class="max-w-6xl mx-auto mb-8 text-center">
      <h1 class="text-4xl sm:text-5xl font-extrabold text-gray-900 mb-4">Free Notes for Download</h1>
      <p class="text-lg text-gray-600 max-w-2xl mx-auto">
        Browse our collection of free notes on various topics. Click download to get your copy instantly!
      </p>
  
      <div class="mt-6 max-w-md mx-auto">
        <input type="text" placeholder="Search notes by title or topic..."
               class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200"
               [(ngModel)]="searchTerm" (input)="filterNotes()">
      </div>
    </div>
  
    <div class="max-w-6xl mx-auto mb-8 flex flex-wrap justify-center gap-2">
      <button
        class="px-4 py-2 rounded-full text-sm font-medium transition duration-200"
        [ngClass]="{'bg-blue-600 text-white shadow-md': selectedCategory === 'All', 'bg-gray-200 text-gray-700 hover:bg-gray-300': selectedCategory !== 'All'}"
        (click)="selectCategory('All')">
        All Categories
      </button>
      <button *ngFor="let category of categories"
        class="px-4 py-2 rounded-full text-sm font-medium transition duration-200"
        [ngClass]="{'bg-blue-600 text-white shadow-md': selectedCategory === category, 'bg-gray-200 text-gray-700 hover:bg-gray-300': selectedCategory !== category}"
        (click)="selectCategory(category)">
        {{ category }}
      </button>
    </div>
  
  
    <div *ngIf="filteredNotes.length === 0" class="text-center text-gray-600 text-xl py-12">
      No notes found matching your criteria.
    </div>
  
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 max-w-6xl mx-auto">
      <div *ngFor="let note of filteredNotes"
           class="bg-white rounded-lg shadow-lg hover:shadow-xl transition-shadow duration-300 ease-in-out p-6 flex flex-col justify-between">
        <div>
          <h3 class="text-xl font-semibold text-gray-800 mb-2 truncate" title="{{ note.title }}">{{ note.title }}</h3>
          <p class="text-gray-600 text-sm mb-4 line-clamp-3">{{ note.description }}</p>
        </div>
        <div>
          <div class="flex items-center text-gray-500 text-xs mb-3">
            <i class="fas fa-file-alt mr-2"></i>
            <span>{{ note.fileType.toUpperCase() }} File</span>
            <span class="mx-2">•</span>
            <span>{{ note.fileSize }}</span>
          </div>
          <button
            class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center transition duration-300 ease-in-out shadow-md hover:shadow-lg"
            (click)="downloadNote(note.downloadUrl, note.title + '.' + note.fileType)">
            <i class="fas fa-download mr-3 text-lg"></i>
            Download Now
          </button>
        </div>
      </div>
    </div>
  
  </div>

  <app-footer></app-footer>
