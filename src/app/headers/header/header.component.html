<header 
  class="header bg-white text-black fixed w-full z-30 transition-all duration-300 ease-out"
  [class.shadow-lg]="isScrolled"
  [class.header-scrolled]="isScrolled"
  [class.header-top]="!isScrolled"
>
  <div class="container mx-auto px-4">
    <!-- Main Navigation Row -->
    <div class="flex items-center justify-between py-3">
      <!-- Logo Section with Animation -->
      <div class="flex items-center space-x-3 group">
        <div class="relative overflow-hidden rounded-full group-hover:scale-105 transition-transform duration-300">
          <img 
            src="assets/myallimages/IMG-20250801-WA0044.jpg" 
            alt="Coaching Logo" 
            class="h-12 w-12 md:h-14 md:w-14 object-cover rounded-full ring-2 ring-gray-200 ring-offset-2 transition-all duration-300 group-hover:ring-blue-400 group-hover:ring-offset-4"
            routerLink="/"
          />
          <!-- Animated shine effect -->
          <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-700"></div>
        </div>
        <a 
          routerLink="/" 
          class="logo text-2xl font-bold relative overflow-hidden"
        >
          <span class="relative z-10 text-gray-900 group-hover:text-blue-600 transition-colors duration-300">
            UAC
          </span>
          <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-blue-600 group-hover:w-full transition-all duration-500 ease-out"></span>
        </a>
      </div>

      <!-- Desktop Navigation with Hover Effects -->
      <nav class="hidden md:flex items-center space-x-1">
        <a 
          *ngFor="let item of navItems; let i = index"
          [id]="item.id"
          [routerLink]="item.route"
          routerLinkActive="text-blue-600"
          [routerLinkActiveOptions]="{exact: item.route === '/'}"
          class="nav-link relative px-4 py-2 text-sm font-medium text-gray-700 hover:text-blue-600 transition-all duration-300"
          [style.animation-delay]="i * 50 + 'ms'"
        >
          {{ item.label }}
          <span 
            class="absolute bottom-0 left-1/2 transform -translate-x-1/2 w-0 h-0.5 bg-blue-600 transition-all duration-300 rounded-full opacity-0"
            [class.active]="isActive(item.route)"
            [class.hover]="!isActive(item.route)"
          ></span>
        </a>
      </nav>

      <!-- Mobile Menu Toggle with Animation -->
      <button 
        (click)="toggleMenu()"
        class="md:hidden p-3 rounded-full hover:bg-gray-100 transition-all duration-300 active:scale-95"
        aria-label="Toggle menu"
        [attr.aria-expanded]="isMenuOpen"
      >
        <div class="relative w-6 h-6">
          <!-- Animated hamburger lines -->
          <span 
            class="absolute top-1 left-0 w-6 h-0.5 bg-gray-800 rounded-full transition-all duration-300"
            [ngClass]="{'rotate-45 top-3': isMenuOpen, 'top-1': !isMenuOpen}"
          ></span>
          <span 
            class="absolute top-3 left-0 w-6 h-0.5 bg-gray-800 rounded-full transition-all duration-300"
            [ngClass]="{'opacity-0': isMenuOpen}"
          ></span>
          <span 
            class="absolute top-5 left-0 w-6 h-0.5 bg-gray-800 rounded-full transition-all duration-300"
            [ngClass]="{'-rotate-45 top-3': isMenuOpen, 'top-5': !isMenuOpen}"
          ></span>
        </div>
      </button>
    </div>

    <!-- Breadcrumb with Fade-in Animation -->
    <div 
      class="border-t border-gray-100 py-2 overflow-hidden"
      [@breadcrumbAnimation]="breadcrumbs.length"
    >
      <nav class="text-sm flex items-center animate-fadeIn">
        <a 
          routerLink="/" 
          class="text-gray-600 hover:text-blue-600 transition-colors duration-300 flex items-center group"
        >
          <svg 
            class="w-4 h-4 mr-1 transition-transform duration-300 group-hover:scale-110" 
            fill="currentColor" 
            viewBox="0 0 20 20"
          >
            <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
          </svg>
          <span class="relative">
            Home
            <span class="absolute bottom-0 left-0 w-0 h-px bg-blue-600 group-hover:w-full transition-all duration-300"></span>
          </span>
        </a>
        
        <!-- Animated breadcrumb items -->
        <div 
          *ngFor="let breadcrumb of breadcrumbs; let last = last" 
          class="flex items-center"
          [@breadcrumbItem]="{value: breadcrumb.label, params: {delay: last ? '200ms' : '0ms'}}"
        >
          <svg class="w-4 h-4 mx-2 text-gray-300 animate-pulse-slow" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
          </svg>
          <span 
            *ngIf="last"
            class="text-gray-900 font-medium relative"
          >
            {{ breadcrumb.label }}
            <span class="absolute -bottom-1 left-0 w-full h-0.5 bg-gradient-to-r from-blue-400 to-blue-600 rounded-full animate-width-grow"></span>
          </span>
          <a 
            *ngIf="!last" 
            [routerLink]="breadcrumb.url"
            class="text-gray-600 hover:text-blue-600 transition-colors duration-300"
          >
            {{ breadcrumb.label }}
          </a>
        </div>
      </nav>
    </div>

    <!-- Mobile Menu with Slide-in Animation -->
    <div 
      class="md:hidden overflow-hidden"
      *ngIf="isMenuOpen"
      [@slideInOut]
    >
      <div class="bg-white shadow-xl rounded-xl mt-2 p-2 animate-slideDown">
        <div class="space-y-1">
          <a 
            *ngFor="let item of navItems; let i = index"
            [id]="item.id"
            [routerLink]="item.route"
            (click)="closeMobileMenu()"
            class="mobile-nav-item block px-4 py-3 rounded-lg hover:bg-blue-50 transition-all duration-300 hover:translate-x-2 hover:shadow-md"
            [style.animation-delay]="i * 100 + 'ms'"
          >
            <div class="flex items-center justify-between">
              <span class="font-medium text-gray-800">{{ item.label }}</span>
              <svg class="w-4 h-4 text-gray-400 transition-transform duration-300 group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
            </div>
            <div class="mt-1 text-xs text-gray-500 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
              Click to navigate
            </div>
          </a>
        </div>
        
        <!-- Mobile Menu Footer -->
        <div class="mt-4 pt-4 border-t border-gray-100 animate-fadeIn delay-500">
          <div class="text-center text-sm text-gray-500">
            <p>UAC - Excellence in Education</p>
            <p class="text-xs mt-1">{{ currentYear }} Academic Session</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
