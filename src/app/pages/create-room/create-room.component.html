<div class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-black flex items-center justify-center p-4">

  <div class="w-full max-w-2xl">

    <div
      class="bg-slate-900/80 backdrop-blur-xl border border-slate-700 rounded-3xl shadow-2xl p-8">

      <!-- Header -->
      <div class="text-center mb-8">

        <h1 class="text-4xl md:text-5xl font-bold text-white mb-3">
          ⚔️ Battle Arena
        </h1>

        <p class="text-slate-400">
          Create a room or join your friend's battle
        </p>

      </div>

      <!-- Tabs -->
      <div class="flex bg-slate-800 rounded-xl p-1 mb-8">

        <button
          (click)="mode='create'"
          class="flex-1 py-3 rounded-lg font-medium transition-all duration-300"
          [ngClass]="
            mode === 'create'
              ? 'bg-cyan-500 text-black'
              : 'text-slate-300'
          ">

          🚀 Create Room

        </button>

        <button
          (click)="mode='join'"
          class="flex-1 py-3 rounded-lg font-medium transition-all duration-300"
          [ngClass]="
            mode === 'join'
              ? 'bg-green-500 text-black'
              : 'text-slate-300'
          ">

          🎮 Join Room

        </button>

      </div>

      <!-- CREATE ROOM -->
      <div *ngIf="mode === 'create'">

        <div class="grid md:grid-cols-2 gap-5">

          <div>
            <label class="block text-slate-300 mb-2">
              Class
            </label>

            <select
              [(ngModel)]="className"
              class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white">

              <option value="">Select Class</option>
              <option value="6">Class 6</option>
              <option value="7">Class 7</option>
              <option value="8">Class 8</option>
              <option value="9">Class 9</option>
              <option value="10">Class 10</option>
              <option value="11">Class 11</option>
              <option value="12">Class 12</option>

            </select>
          </div>

          <div>
            <label class="block text-slate-300 mb-2">
              Subject
            </label>

            <select
              [(ngModel)]="subject"
              class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white">

              <option value="">Select Subject</option>
              <option value="Math">Mathematics</option>
              <option value="Science">Science</option>
              <option value="Physics">Physics</option>
              <option value="Chemistry">Chemistry</option>
              <option value="Biology">Biology</option>
              <option value="English">English</option>

            </select>
          </div>

          <div>
            <label class="block text-slate-300 mb-2">
              Difficulty
            </label>

            <select
              [(ngModel)]="difficulty"
              class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white">

              <option value="easy">🟢 Easy</option>
              <option value="medium">🟡 Medium</option>
              <option value="hard">🔴 Hard</option>

            </select>
          </div>

          <div>
            <label class="block text-slate-300 mb-2">
              Questions
            </label>

            <select
              [(ngModel)]="questionCount"
              class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white">

              <option [value]="5">5 Questions</option>
              <option [value]="10">10 Questions</option>
              <option [value]="15">15 Questions</option>

            </select>
          </div>

        </div>

        <button
          (click)="createRoom()"
          [disabled]="isLoading"
          class="w-full mt-8 py-4 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-black font-bold text-lg">

          {{
            isLoading
              ? 'Creating Battle...'
              : '🚀 Create Battle Room'
          }}

        </button>

      </div>

      <!-- JOIN ROOM -->
      <div *ngIf="mode === 'join'">

        <div
          class="bg-slate-800 border border-slate-700 rounded-2xl p-6">

          <label class="block text-slate-300 mb-3">
            Room Code
          </label>

          <input
            type="text"
            [(ngModel)]="joinRoomCode"
            placeholder="Enter Room Code"
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-4 text-white uppercase tracking-widest">

          <p class="text-slate-500 text-sm mt-3">
            Enter the room code shared by your friend.
          </p>

          <button
            (click)="joinRoom()"
            class="w-full mt-6 py-4 rounded-xl bg-green-500 hover:bg-green-400 text-black font-bold text-lg">

            ⚔️ Join Battle

          </button>

        </div>

      </div>

    </div>

  </div>

</div>
